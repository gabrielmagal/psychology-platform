quarkus.http.port=8080

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:arquitetura}
quarkus.datasource.password=${DB_PASSWORD:admin}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://host.docker.internal:5432/psychology}
quarkus.datasource.jdbc.min-size=4
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:16}
# Devolve conexões ociosas em vez de mantê-las presas ao pool indefinidamente.
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.acquisition-timeout=10S
# Detecta conexões derrubadas pelo banco/firewall antes de entregá-las a uma requisição.
quarkus.datasource.jdbc.background-validation-interval=2M

# Hibernate
# Agrupa INSERT/UPDATE em lotes: menos round-trips por transação de escrita.
quarkus.hibernate-orm.jdbc.statement-batch-size=25
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.second-level-caching-enabled=false

# Cors
quarkus.http.cors=true
# Em produção, restrinja para a(s) origem(ns) do front — ex.: CORS_ORIGINS=https://app.exemplo.com.br
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.headers=Content-Type,Authorization,Tenant
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# HealthCheck
quarkus.health.openapi.included=true

# Http Disable Quarkus Proactive
quarkus.http.auth.proactive=false

# Compressão de respostas — os payloads de listagem/metadata são JSON verboso.
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,text/html,text/plain

# Dev
quarkus.devservices.enabled=false

# Keycloak
keycloak.url=${KEYCLOAK_URL:http://localhost:8083}
keycloak.user=${KEYCLOAK_ADMIN_USER:arquitetura}
keycloak.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.realm=${KEYCLOAK_REALM:master}
# Por quanto tempo o resultado da introspecção de um token pode ser reaproveitado.
# 0 desativa o cache (uma ida ao Keycloak por requisição — o comportamento antigo).
keycloak.introspection.cache-ttl-seconds=${KEYCLOAK_INTROSPECTION_TTL:60}

# Clients confidenciais por tenant.
# ATENÇÃO: estes secrets estavam fixos no código-fonte e continuam versionados aqui apenas
# para não quebrar os ambientes existentes. Devem ser rotacionados no Keycloak e passados
# por variável de ambiente (TENANT_CLIENTS_<TENANT>_SECRET) ou gestor de segredos.
tenant.clients.barueri.client-id=${TENANT_BARUERI_CLIENT_ID:backend}
tenant.clients.barueri.secret=${TENANT_BARUERI_SECRET:jBmhRAsGfp9QWcRTDBGdlSqXv959DWt0}
tenant.clients.campinas.client-id=${TENANT_CAMPINAS_CLIENT_ID:backend}
tenant.clients.campinas.secret=${TENANT_CAMPINAS_SECRET:giRyjMncqT8x1Q7cm4BIkEcTZ4g8l46h}
tenant.clients.doacoesalimenticias.client-id=${TENANT_DOACOESALIMENTICIAS_CLIENT_ID:doacoesalimenticias-backend}
tenant.clients.doacoesalimenticias.secret=${TENANT_DOACOESALIMENTICIAS_SECRET:FwS35Wrktt0526i2lVMPV2RF4FAgdItG}
tenant.clients.petrodoacoes.client-id=${TENANT_PETRODOACOES_CLIENT_ID:petrodoacoes-backend}
tenant.clients.petrodoacoes.secret=${TENANT_PETRODOACOES_SECRET:rCuZpfNN7LInS5BqqRMoQMFf8BeTHFIY}

# Minio
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:mindhaven}
minio.secure=${MINIO_SECURE:false}

# Flyway
# As migrations são aplicadas por tenant sob demanda (core.service.TenantSchemaServiceImpl),
# não na inicialização.
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration/default

quarkus.resteasy-reactive.jackson.accept-case-insensitive-enums=true
quarkus.resteasy-reactive.json.default-object-mapper=jackson

# ---------------------------------------------------------------------------
# Perfil de teste: H2 em memória, sem depender de Postgres/Keycloak/MinIO no ar.
# ---------------------------------------------------------------------------
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:mindhaven;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.jdbc.max-size=8
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=false
%test.keycloak.introspection.cache-ttl-seconds=60
%test.tenant.clients.barueri.client-id=backend
%test.tenant.clients.barueri.secret=test-secret
